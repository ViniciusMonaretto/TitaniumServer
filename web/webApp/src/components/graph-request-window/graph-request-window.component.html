<h2 mat-dialog-title>Opções Gráfico</h2>
<mat-dialog-content>
    <sensor-selector [uiConfig]="uiConfig" [(groups)]="selectedGroups" [(sensors)]="selectedSensors"></sensor-selector>
    <div>
        <div class="date-picker-class">
            <mat-form-field appearance="outline">
                <mat-label>Data de Início</mat-label>
                <input matInput [matDatepicker]="pickerStart" [(ngModel)]="startDate">
                <mat-datepicker-toggle matSuffix [for]="pickerStart"></mat-datepicker-toggle>
                <mat-datepicker #pickerStart></mat-datepicker>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label></mat-label>
                <input matInput type="time" [value]="timeInputValue(startDate)" (change)="setTime($event, startDate)">
            </mat-form-field>
        </div>

        <div class="date-picker-class">
            <mat-form-field appearance="outline">
                <mat-label>Data de Fim</mat-label>
                <input matInput [matDatepicker]="pickerEnd" [(ngModel)]="endDate">
                <mat-datepicker-toggle matSuffix [for]="pickerEnd"></mat-datepicker-toggle>
                <mat-datepicker #pickerEnd></mat-datepicker>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label></mat-label>
                <input matInput type="time" [value]="timeInputValue(endDate)" (change)="setTime($event, endDate)">
            </mat-form-field>
        </div>

    </div>

</mat-dialog-content>
<mat-dialog-actions style="display: flex; gap: 10px;">
    <io-button style="height: 30px;" variant="danger" (clicked)="onNoClick()">Cancelar</io-button>
    <io-button style="height: 30px;" variant="primary" [disabled]="!validForm()"
        (clicked)="onAddCLick()">Adicionar</io-button>
</mat-dialog-actions>
